<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- 16px cut of logo.svg, used for icon-16.png. At this size the rounded
       bolt blurs into a plus sign, so this one is larger, unrounded, and has
       its straight edges on whole pixels. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8ef0"/>
      <stop offset=".25" stop-color="#8682f6"/>
      <stop offset=".5" stop-color="#b978e7"/>
      <stop offset=".75" stop-color="#e072c6"/>
      <stop offset="1" stop-color="#fb7299"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <path d="M9 2 3 9h4v5l6-8H9V2Z" fill="#fff"/>
</svg>
